name: Site checks and deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
        env:
          SITE_URL: https://gitaarmethamlet.be
          PUBLIC_LESSON_FORM_ENDPOINT: ${{ vars.LESSON_FORM_ENDPOINT }}
      - name: Check out the published review page
        uses: actions/checkout@v4
        with:
          repository: SavaJulian/Hamlet-Review-pagina
          ref: 6be9408f60bec0511ed8aa86af09596cc25952e9
          path: review-source
          persist-credentials: false
      - name: Serve the review page on the main domain
        run: |
          mkdir -p dist/review
          cp review-source/{index.html,app.js,config.js,prive-bericht.html,prive-bericht.js} dist/review/
      - uses: actions/upload-artifact@v4
        with:
          name: hamlet-static-site
          path: dist
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
